[build]
builder = "nixpacks"
# -T 1C = parallel threads, -DskipTests = skip 82 tests for deploy (CI runs verify)
# dependency:go-offline is cached by nixpacks install phase below
buildCommand = "mvn -B -T 1C -DskipTests clean package"

[deploy]
# Container-aware heap (Railway gives 512MB-1GB), PORT is injected by Railway
startCommand = "java -Xms128m -Xmx512m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+UseStringDeduplication -Dserver.port=${PORT} -jar target/SharveshMart-1.0.0-SNAPSHOT.jar"
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
# Optional: uncomment to run on a schedule (not needed for web service)
# cronSchedule = "0 * * * *"
