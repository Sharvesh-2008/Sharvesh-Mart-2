# Spring Boot Application Properties
spring.application.name=SharveshMart
server.port=${PORT:8080}
# Railway: graceful shutdown for zero-downtime deploys
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=15s

# Logging Configuration (Railway log drain prefers console, less DEBUG in prod)
logging.level.root=INFO
logging.level.com.sharvesh_mart=${LOG_LEVEL:DEBUG}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Static Resource Handling (Embedded Tomcat serves static UI automatically)
spring.web.resources.static-locations=classpath:/static/
# Enable gzip for static assets (faster on Railway edge)
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json
server.compression.min-response-size=1024

# AI Chatbot Configuration (Section 11 & Section 17 Specification)
ai.chatbot.provider=${AI_CHATBOT_PROVIDER:mock}
ai.chatbot.api-key=${AI_CHATBOT_API_KEY:}
ai.chatbot.model=${AI_CHATBOT_MODEL:gemini-1.5-flash}
